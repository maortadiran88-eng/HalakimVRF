<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MA150 Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050a0f;
    --panel: #0a1520;
    --border: #0d2535;
    --green: #00ff88;
    --red: #ff3355;
    --amber: #ffb800;
    --blue: #00aaff;
    --text: #c8dde8;
    --muted: #3a5a6a;
    --glow-green: 0 0 20px rgba(0,255,136,0.4);
    --glow-red: 0 0 20px rgba(255,51,85,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow Condensed', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,170,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,170,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0 30px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 16px;
  }

  .logo {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .logo h1 {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: -1px;
    color: #fff;
    line-height: 1;
  }

  .logo .ma {
    color: var(--blue);
    text-shadow: 0 0 30px rgba(0,170,255,0.6);
  }

  .logo .tag {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
  }
  .dot.live {
    background: var(--green);
    box-shadow: var(--glow-green);
    animation: pulse 1.5s ease-in-out infinite;
  }
  .dot.scanning {
    background: var(--amber);
    box-shadow: 0 0 12px rgba(255,184,0,0.5);
    animation: pulse 0.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .status-text {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .next-scan {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    align-items: center;
  }

  .btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 10px 24px;
    border: 1px solid;
    cursor: pointer;
    transition: all 0.15s;
    background: transparent;
  }

  .btn-primary {
    border-color: var(--blue);
    color: var(--blue);
  }
  .btn-primary:hover {
    background: var(--blue);
    color: var(--bg);
    box-shadow: 0 0 20px rgba(0,170,255,0.3);
  }
  .btn-primary:disabled {
    border-color: var(--muted);
    color: var(--muted);
    cursor: not-allowed;
  }

  .btn-stop {
    border-color: var(--red);
    color: var(--red);
  }
  .btn-stop:hover {
    background: var(--red);
    color: #fff;
    box-shadow: var(--glow-red);
  }

  .ma-input-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--border);
    padding: 8px 16px;
    background: var(--panel);
  }

  .ma-input-wrap label {
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .ma-input-wrap input {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--blue);
    color: var(--blue);
    font-family: 'Share Tech Mono', monospace;
    font-size: 18px;
    width: 60px;
    text-align: center;
    outline: none;
  }

  .interval-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--border);
    padding: 8px 16px;
    background: var(--panel);
  }

  .interval-wrap label {
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .interval-wrap select {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--amber);
    color: var(--amber);
    font-family: 'Share Tech Mono', monospace;
    font-size: 16px;
    outline: none;
    cursor: pointer;
  }

  .interval-wrap select option {
    background: var(--bg);
    color: var(--text);
  }

  /* Stats row */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 16px 20px;
    position: relative;
    overflow: hidden;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }

  .stat-card.blue::before { background: var(--blue); }
  .stat-card.green::before { background: var(--green); }
  .stat-card.red::before { background: var(--red); }
  .stat-card.amber::before { background: var(--amber); }

  .stat-label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .stat-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 32px;
    font-weight: bold;
    line-height: 1;
  }

  .stat-card.blue .stat-value { color: var(--blue); }
  .stat-card.green .stat-value { color: var(--green); }
  .stat-card.red .stat-value { color: var(--red); }
  .stat-card.amber .stat-value { color: var(--amber); }

  /* Alerts section */
  .section-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 14px;
  }

  .section-title {
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .section-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Alert card */
  .alerts-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 24px;
    max-height: 320px;
    overflow-y: auto;
  }

  .alerts-grid::-webkit-scrollbar { width: 4px; }
  .alerts-grid::-webkit-scrollbar-track { background: var(--panel); }
  .alerts-grid::-webkit-scrollbar-thumb { background: var(--border); }

  .alert-card {
    display: grid;
    grid-template-columns: auto 1fr auto auto auto;
    align-items: center;
    gap: 20px;
    padding: 14px 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    animation: slideIn 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .alert-card.cross-up {
    border-left: 3px solid var(--green);
  }
  .alert-card.cross-up::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(0,255,136,0.05) 0%, transparent 40%);
    pointer-events: none;
  }

  .alert-card.cross-down {
    border-left: 3px solid var(--red);
  }
  .alert-card.cross-down::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(255,51,85,0.05) 0%, transparent 40%);
    pointer-events: none;
  }

  .alert-type-badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 2px;
    white-space: nowrap;
  }

  .cross-up .alert-type-badge {
    background: rgba(0,255,136,0.1);
    color: var(--green);
    border: 1px solid rgba(0,255,136,0.3);
  }

  .cross-down .alert-type-badge {
    background: rgba(255,51,85,0.1);
    color: var(--red);
    border: 1px solid rgba(255,51,85,0.3);
  }

  .alert-symbol {
    font-size: 22px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 1px;
  }

  .alert-details {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .alert-name {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .alert-price {
    font-family: 'Share Tech Mono', monospace;
    font-size: 22px;
    color: #fff;
  }

  .alert-ma {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }

  .alert-ma-label {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .alert-ma-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 16px;
    color: var(--blue);
  }

  .alert-time {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  .empty-state {
    padding: 40px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: 1px dashed var(--border);
    background: var(--panel);
  }

  /* Watchlist table */
  .table-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead tr {
    border-bottom: 1px solid var(--border);
  }

  th {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 10px 14px;
    text-align: right;
    font-weight: 400;
  }

  th:first-child { text-align: right; }

  tbody tr {
    border-bottom: 1px solid rgba(13,37,53,0.5);
    transition: background 0.1s;
  }

  tbody tr:hover { background: rgba(0,170,255,0.03); }

  td {
    padding: 11px 14px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    text-align: right;
  }

  td:first-child {
    text-align: right;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 17px;
    color: #fff;
    letter-spacing: 1px;
  }

  td.name-cell {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: var(--muted);
  }

  .change-positive { color: var(--green); }
  .change-negative { color: var(--red); }

  .ma-cell { color: var(--blue); }

  .diff-positive { color: var(--green); }
  .diff-negative { color: var(--red); }

  .loading-row td {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 2px;
    text-align: center !important;
    padding: 20px;
  }

  /* Progress bar */
  .scan-progress {
    height: 2px;
    background: var(--border);
    margin-bottom: 24px;
    overflow: hidden;
    display: none;
  }

  .scan-progress.active { display: block; }

  .scan-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--blue), var(--green));
    width: 0%;
    transition: width 0.3s;
  }

  .progress-text {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
    display: none;
  }
  .progress-text.active { display: block; }

  /* Near MA indicator */
  .near-badge {
    font-size: 10px;
    letter-spacing: 1px;
    padding: 2px 6px;
    border-radius: 2px;
    background: rgba(255,184,0,0.1);
    color: var(--amber);
    border: 1px solid rgba(255,184,0,0.3);
  }

  @media (max-width: 768px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .alert-card { grid-template-columns: auto 1fr auto; }
    .alert-ma, .alert-time { display: none; }
    h1 { font-size: 28px !important; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">
      <div>
        <h1><span class="ma">MA</span>150 <span style="color:var(--muted);font-size:28px">SCANNER</span></h1>
        <div class="tag">S&P 500 · Real-Time Crossover Alert System</div>
      </div>
    </div>
    <div class="header-right">
      <div class="status-bar">
        <div class="dot" id="statusDot"></div>
        <span class="status-text" id="statusText">IDLE — לחץ סריקה להתחלה</span>
      </div>
      <div class="next-scan" id="nextScanText"></div>
    </div>
  </header>

  <div class="controls">
    <div class="ma-input-wrap">
      <label>ממוצע</label>
      <input type="number" id="maInput" value="150" min="5" max="500">
      <label style="color:var(--blue)">MA</label>
    </div>
    <div class="interval-wrap">
      <label>רענון</label>
      <select id="intervalSelect">
        <option value="60">60 שנ׳</option>
        <option value="120" selected>2 דק׳</option>
        <option value="300">5 דק׳</option>
        <option value="600">10 דק׳</option>
      </select>
    </div>
    <button class="btn btn-primary" id="startBtn" onclick="startScanner()">▶ התחל סריקה</button>
    <button class="btn btn-stop" id="stopBtn" onclick="stopScanner()" style="display:none">■ עצור</button>
  </div>

  <div class="progress-text active" id="progressText"></div>
  <div class="scan-progress" id="scanProgress">
    <div class="scan-progress-bar" id="scanBar"></div>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card blue">
      <div class="stat-label">מניות נסרקות</div>
      <div class="stat-value" id="statTotal">0</div>
    </div>
    <div class="stat-card green">
      <div class="stat-label">חצו מעלה ↑</div>
      <div class="stat-value" id="statUp">0</div>
    </div>
    <div class="stat-card red">
      <div class="stat-label">חצו מטה ↓</div>
      <div class="stat-value" id="statDown">0</div>
    </div>
    <div class="stat-card amber">
      <div class="stat-label">קרוב לממוצע</div>
      <div class="stat-value" id="statNear">0</div>
    </div>
  </div>

  <!-- Alerts -->
  <div class="section-header">
    <div class="section-title">🔔 התראות חציה</div>
    <div class="section-line"></div>
    <div class="status-text" id="alertCount">0 התראות</div>
  </div>
  <div class="alerts-grid" id="alertsContainer">
    <div class="empty-state">ממתין לסריקה ראשונה...</div>
  </div>

  <!-- Watchlist -->
  <div class="section-header" style="margin-top:8px">
    <div class="section-title">📊 כל המניות</div>
    <div class="section-line"></div>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>סימול</th>
          <th>שם</th>
          <th>מחיר</th>
          <th>שינוי %</th>
          <th>MA<span id="maLabel">150</span></th>
          <th>פער</th>
          <th>סטטוס</th>
        </tr>
      </thead>
      <tbody id="stockTable">
        <tr class="loading-row"><td colspan="7">לחץ "התחל סריקה" להתחלה</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const STOCKS = [
  {sym:'AAPL', name:'Apple'},
  {sym:'MSFT', name:'Microsoft'},
  {sym:'NVDA', name:'NVIDIA'},
  {sym:'AMZN', name:'Amazon'},
  {sym:'GOOGL', name:'Alphabet'},
  {sym:'META', name:'Meta'},
  {sym:'TSLA', name:'Tesla'},
  {sym:'BRK-B', name:'Berkshire'},
  {sym:'AVGO', name:'Broadcom'},
  {sym:'JPM', name:'JPMorgan'},
  {sym:'LLY', name:'Eli Lilly'},
  {sym:'V', name:'Visa'},
  {sym:'UNH', name:'UnitedHealth'},
  {sym:'XOM', name:'ExxonMobil'},
  {sym:'MA', name:'Mastercard'},
  {sym:'COST', name:'Costco'},
  {sym:'HD', name:'Home Depot'},
  {sym:'PG', name:'P&G'},
  {sym:'JNJ', name:'J&J'},
  {sym:'NFLX', name:'Netflix'},
  {sym:'CRM', name:'Salesforce'},
  {sym:'BAC', name:'Bank of America'},
  {sym:'AMD', name:'AMD'},
  {sym:'ORCL', name:'Oracle'},
  {sym:'WMT', name:'Walmart'},
  {sym:'KO', name:'Coca-Cola'},
  {sym:'MRK', name:'Merck'},
  {sym:'CVX', name:'Chevron'},
  {sym:'INTC', name:'Intel'},
  {sym:'DIS', name:'Disney'},
];

let scanInterval = null;
let countdown = null;
let prevData = {};
let alerts = [];
let stockData = {};
let scanRunning = false;
let scanCountdown = 0;

function getMaPeriod() { return parseInt(document.getElementById('maInput').value) || 150; }
function getInterval() { return parseInt(document.getElementById('intervalSelect').value) || 120; }

async function fetchStock(sym) {
  // Use Yahoo Finance via allorigins proxy
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=1y`;
  const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
  const res = await fetch(proxy);
  const json = await res.json();
  const result = json?.chart?.result?.[0];
  if (!result) return null;

  const closes = result.indicators.quote[0].close;
  const meta = result.meta;
  const currentPrice = meta.regularMarketPrice;
  const prevClose = meta.chartPreviousClose;
  const changePct = ((currentPrice - prevClose) / prevClose) * 100;

  // Compute MA
  const maPeriod = getMaPeriod();
  const validCloses = closes.filter(c => c !== null);
  const slice = validCloses.slice(-maPeriod);
  const ma = slice.length === maPeriod ? slice.reduce((a,b) => a+b, 0) / maPeriod : null;

  return { sym, price: currentPrice, prevClose, changePct, ma, closes: validCloses };
}

function checkCrossover(sym, price, ma) {
  const prev = prevData[sym];
  if (!prev || !ma || !prev.ma) return null;
  const crossedUp = prev.price < prev.ma && price >= ma;
  const crossedDown = prev.price > prev.ma && price <= ma;
  return crossedUp ? 'cross-up' : crossedDown ? 'cross-down' : null;
}

function playAlert(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = type === 'cross-up' ? 880 : 440;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
  } catch(e) {}
}

function addAlert(sym, name, price, ma, type) {
  const now = new Date();
  const timeStr = now.toLocaleTimeString('he-IL');
  alerts.unshift({ sym, name, price, ma, type, time: timeStr });
  if (alerts.length > 50) alerts.pop();
  renderAlerts();
  playAlert(type);
}

function renderAlerts() {
  const container = document.getElementById('alertsContainer');
  document.getElementById('alertCount').textContent = `${alerts.length} התראות`;
  if (alerts.length === 0) {
    container.innerHTML = '<div class="empty-state">אין חציות עדיין — הסריקה פעילה</div>';
    return;
  }
  container.innerHTML = alerts.map(a => `
    <div class="alert-card ${a.type}">
      <span class="alert-type-badge">${a.type === 'cross-up' ? '▲ חצה מעלה' : '▼ חצה מטה'}</span>
      <span class="alert-symbol">${a.sym}</span>
      <div class="alert-details">
        <span class="alert-name">${a.name}</span>
        <span class="alert-price">$${a.price.toFixed(2)}</span>
      </div>
      <div class="alert-ma">
        <span class="alert-ma-label">MA${getMaPeriod()}</span>
        <span class="alert-ma-value">$${a.ma.toFixed(2)}</span>
      </div>
      <span class="alert-time">${a.time}</span>
    </div>
  `).join('');
}

function renderTable() {
  const maPeriod = getMaPeriod();
  document.getElementById('maLabel').textContent = maPeriod;

  let upCount = 0, downCount = 0, nearCount = 0;
  const rows = STOCKS.map(s => {
    const d = stockData[s.sym];
    if (!d) return `<tr class="loading-row"><td>${s.sym}</td><td colspan="6" style="color:var(--muted);font-size:11px">טוען...</td></tr>`;

    const changeCls = d.changePct >= 0 ? 'change-positive' : 'change-negative';
    const changeSign = d.changePct >= 0 ? '+' : '';

    let maCell = '—';
    let diffCell = '—';
    let statusCell = '—';

    if (d.ma) {
      const diff = ((d.price - d.ma) / d.ma) * 100;
      const diffCls = diff >= 0 ? 'diff-positive' : 'diff-negative';
      const diffSign = diff >= 0 ? '+' : '';
      maCell = `<span class="ma-cell">$${d.ma.toFixed(2)}</span>`;
      diffCell = `<span class="${diffCls}">${diffSign}${diff.toFixed(2)}%</span>`;

      const absDiff = Math.abs(diff);
      if (d.price >= d.ma) { upCount++; statusCell = '<span style="color:var(--green)">▲ מעל</span>'; }
      else { downCount++; statusCell = '<span style="color:var(--red)">▼ מתחת</span>'; }
      if (absDiff <= 1.5) { nearCount++; statusCell += ' <span class="near-badge">קרוב!</span>'; }
    }

    return `
      <tr>
        <td>${s.sym}</td>
        <td class="name-cell">${s.name}</td>
        <td>$${d.price.toFixed(2)}</td>
        <td class="${changeCls}">${changeSign}${d.changePct.toFixed(2)}%</td>
        <td>${maCell}</td>
        <td>${diffCell}</td>
        <td>${statusCell}</td>
      </tr>`;
  }).join('');

  document.getElementById('stockTable').innerHTML = rows;
  document.getElementById('statTotal').textContent = Object.keys(stockData).length;
  document.getElementById('statUp').textContent = upCount;
  document.getElementById('statDown').textContent = downCount;
  document.getElementById('statNear').textContent = nearCount;
}

async function runScan() {
  const dot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  dot.className = 'dot scanning';
  statusText.textContent = 'סורק...';

  const progress = document.getElementById('scanProgress');
  const bar = document.getElementById('scanBar');
  const progressText = document.getElementById('progressText');
  progress.classList.add('active');
  progressText.classList.add('active');

  for (let i = 0; i < STOCKS.length; i++) {
    const s = STOCKS[i];
    progressText.textContent = `סורק ${i+1}/${STOCKS.length}: ${s.sym}`;
    bar.style.width = `${((i+1)/STOCKS.length)*100}%`;

    try {
      const d = await fetchStock(s.sym);
      if (d) {
        const crossover = checkCrossover(s.sym, d.price, d.ma);
        if (crossover) addAlert(s.sym, s.name, d.price, d.ma, crossover);
        prevData[s.sym] = { price: d.price, ma: d.ma };
        stockData[s.sym] = d;
        renderTable();
      }
    } catch(e) {
      console.warn(`Error fetching ${s.sym}:`, e);
    }

    await new Promise(r => setTimeout(r, 300));
  }

  progress.classList.remove('active');
  progressText.textContent = '';
  dot.className = 'dot live';
  statusText.textContent = `סריקה הושלמה · ${new Date().toLocaleTimeString('he-IL')}`;
  startCountdown();
}

function startCountdown() {
  clearInterval(countdown);
  scanCountdown = getInterval();
  const el = document.getElementById('nextScanText');
  countdown = setInterval(() => {
    scanCountdown--;
    el.textContent = `סריקה הבאה בעוד ${scanCountdown} שנ׳`;
    if (scanCountdown <= 0) {
      clearInterval(countdown);
      el.textContent = '';
      if (scanRunning) runScan();
    }
  }, 1000);
}

function startScanner() {
  scanRunning = true;
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'inline-block';
  alerts = [];
  stockData = {};
  renderAlerts();
  renderTable();
  runScan();
}

function stopScanner() {
  scanRunning = false;
  clearInterval(scanInterval);
  clearInterval(countdown);
  document.getElementById('startBtn').style.display = 'inline-block';
  document.getElementById('stopBtn').style.display = 'none';
  document.getElementById('statusDot').className = 'dot';
  document.getElementById('statusText').textContent = 'עצור';
  document.getElementById('nextScanText').textContent = '';
}
</script>
</body>
</html>
