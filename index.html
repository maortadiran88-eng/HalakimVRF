<!DOCTYPE html>

<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>קטלוג חלקי חילוף</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1565c0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="חלקי חילוף">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;direction:rtl;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
:root{--bg:#f0f2f5;--card:#fff;--text:#1a1a2a;--sub:#6b7280;--border:#e5e7eb;--inp:#111;--row1:#fff;--row2:#f9fafb;--hi:#fff9c4;--sel:#e8f5e9;--sidebar:#fff;--ibg:#fff;--shadow:rgba(0,0,0,.08)}
.dark{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--sub:#94a3b8;--border:#334155;--inp:#f1f5f9;--row1:#1e293b;--row2:#0f172a;--hi:#3d3510;--sel:#14532d;--sidebar:#1e293b;--ibg:#334155;--shadow:rgba(0,0,0,.4)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
input,textarea,select{font-family:Arial,sans-serif}
#root{min-height:100vh}
</style>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;background:#0f172a"><div style="font-size:52px">🔧</div><div style="font-size:17px;color:#94a3b8">טוען...</div><div style="width:40px;height:40px;border:4px solid #334155;border-top:4px solid #1565c0;border-radius:50%;animation:spin .9s linear infinite"></div></div></div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyA5SsSCkhQg1R5bi5FitJeB9uzrNm-1L8o",
  authDomain:"helkey-hiluf.firebaseapp.com",
  projectId:"helkey-hiluf",
  storageBucket:"helkey-hiluf.firebasestorage.app",
  messagingSenderId:"622794251696",
  appId:"1:622794251696:web:aafcaf67b729d653de4a75"
});
window._db = firebase.firestore();
window._deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window._deferredPrompt = e; });

async function loadAndRun() {
  try {
    const [compText, appText] = await Promise.all([
      fetch('components.js').then(r => { if(!r.ok) throw new Error('components.js לא נמצא (status ' + r.status + ')'); return r.text(); }),
      fetch('app.js').then(r => { if(!r.ok) throw new Error('app.js לא נמצא (status ' + r.status + ')'); return r.text(); })
    ]);
    const run = code => { const s = document.createElement('script'); s.textContent = Babel.transform(code, {presets:['react']}).code; document.body.appendChild(s); };
    run(compText);
    run(appText);
  } catch(e) {
    document.getElementById('root').innerHTML =
      '<div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px;background:#0f172a;color:#f87171;font-family:Arial;text-align:center;padding:20px">' +
      '<div style="font-size:40px">⚠️</div><div style="font-size:16px;font-weight:bold">שגיאה בטעינה</div>' +
      '<div style="font-size:13px;color:#fca5a5;max-width:400px;word-break:break-all">' + e.message + '</div>' +
      '<div style="font-size:11px;color:#64748b;margin-top:8px">ודא שכל הקבצים הועלו לאותה תיקייה ב-GitHub</div></div>';
    console.error(e);
  }
}
loadAndRun();
</script>

</body>
</html>
